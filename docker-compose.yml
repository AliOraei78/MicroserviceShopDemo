  api-gateway:
    build:
      context: .  # <-- CHANGED FROM .. TO .
      dockerfile: ApiGateway/Dockerfile
    container_name: api-gateway
    ports:
      - "7000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - product-service
      - customer-service
      - order-service