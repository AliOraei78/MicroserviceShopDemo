services:
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  product-service:
    build:
      context: .  # <-- CHANGED FROM .. TO .
      dockerfile: ProductService/Dockerfile
    container_name: product-service
    ports:
      - "7100:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal,1433;Database=ProductDb;User Id=sa;Password=Ali433433;TrustServerCertificate=True;
    depends_on:
      - rabbitmq

  customer-service:
    build:
      context: .  # <-- CHANGED FROM .. TO .
      dockerfile: CustomerService/Dockerfile
    container_name: customer-service
    ports:
      - "7200:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal,1433;Database=CustomerDb;User Id=sa;Password=Ali433433;TrustServerCertificate=True;
    depends_on:
      - rabbitmq

  order-service:
    build:
      context: .  # <-- CHANGED FROM .. TO .
      dockerfile: OrderService/Dockerfile
    container_name: order-service
    ports:
      - "7300:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal,1433;Database=OrderDb;User Id=sa;Password=Ali433433;TrustServerCertificate=True;
    depends_on:
      - rabbitmq

  payment-service:
    build:
      context: .  # <-- CHANGED FROM .. TO .
      dockerfile: PaymentService/Dockerfile
    container_name: payment-service
    ports:
      - "7400:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal,1433;Database=PaymentDb;User Id=sa;Password=Ali433433;TrustServerCertificate=True;
    depends_on:
      - rabbitmq

  notification-service:
    build:
      context: .  # <-- CHANGED FROM .. TO .
      dockerfile: NotificationService/Dockerfile
    container_name: notification-service
    ports:
      - "7500:80"
      - "50051:50051"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - rabbitmq

  inventory-service:
    build:
      context: .
      dockerfile: InventoryService/Dockerfile
    container_name: inventory-service
