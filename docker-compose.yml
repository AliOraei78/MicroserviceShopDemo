      - "7600:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=host.docker.internal,1433;Database=InventoryDb;User Id=sa;Password=Ali433433;TrustServerCertificate=True;
    depends_on:
